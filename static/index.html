<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>RetailPro - Billing &amp; Inventory</title>
<style>
:root{--bg:#f4f6fb;--card:#fff;--ink:#0f172a;--mut:#64748b;--line:#e5e9f2;--pri:#4f46e5;--pri2:#6366f1;--ok:#10b981;--warn:#f59e0b;--bad:#ef4444}
*{box-sizing:border-box;margin:0}body{font-family:Inter,"Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14px}
button,input,select{font:inherit}button{cursor:pointer}
.app{display:grid;grid-template-columns:236px 1fr;min-height:100vh}
aside.side{background:linear-gradient(180deg,#111827,#1e1b4b);color:#c7d2fe;padding:22px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column}
.brand{display:flex;gap:10px;align-items:center;color:#fff;font-weight:700;font-size:18px;padding:0 8px 24px}
.logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#6366f1,#06b6d4);display:grid;place-items:center;font-weight:800}
nav a{display:flex;gap:12px;align-items:center;padding:11px 12px;border-radius:10px;color:#c7d2fe;text-decoration:none;font-weight:500;margin-bottom:4px}
nav a svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav a:hover{background:rgba(255,255,255,.08)}nav a.on{background:var(--pri);color:#fff;box-shadow:0 6px 18px rgba(79,70,229,.45)}
.sfoot{margin-top:auto;font-size:12px;color:#818cf8;padding:8px}
main{padding:26px 30px;min-width:0}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}
.top h1{font-size:24px}.top p{color:var(--mut);margin-top:2px}
.btn{border:0;border-radius:10px;padding:10px 16px;font-weight:600;background:var(--pri);color:#fff;transition:.15s}
.btn:hover{background:#4338ca;transform:translateY(-1px)}.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}.btn.ghost:hover{background:#f8fafc}
.btn.bad{background:#fee2e2;color:#b91c1c}.btn.sm{padding:6px 11px;font-size:12px}.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:0 1px 2px rgba(15,23,42,.04)}
.card h3{font-size:15px;margin-bottom:14px}.row{display:grid;gap:18px;margin-bottom:18px}.r3{grid-template-columns:2fr 1fr}.kpis{grid-template-columns:repeat(4,1fr)}
.kpi .l{color:var(--mut);font-size:12px;text-transform:uppercase;letter-spacing:.5px}.kpi .v{font-size:26px;font-weight:700;margin:6px 0 2px}.kpi .s{font-size:12px;color:var(--mut)}
.kpi{position:relative;overflow:hidden}.kpi:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c,var(--pri))}
table{width:100%;border-collapse:collapse}th{text-align:left;font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.4px;padding:10px 12px;border-bottom:1px solid var(--line)}
td{padding:12px;border-bottom:1px solid #f1f4f9}tr:hover td{background:#fafbff}td.r,th.r{text-align:right}
.pill{padding:3px 10px;border-radius:99px;font-size:11px;font-weight:600}.p-ok{background:#d1fae5;color:#047857}.p-bad{background:#fee2e2;color:#b91c1c}.p-warn{background:#fef3c7;color:#b45309}.p-blue{background:#e0e7ff;color:#4338ca}
.chart{width:100%;height:auto}.chart .grid{stroke:#eef1f7}.chart .ax{font-size:10px;fill:#94a3b8}.chart .bar{fill:url(#g)}.chart .bar:hover{opacity:.8}
.donutwrap{display:flex;gap:18px;align-items:center;flex-wrap:wrap}.donut{width:150px}.dn{font-size:15px;font-weight:700;fill:#0f172a}.dl{font-size:9px;fill:#94a3b8}
.legend{list-style:none;padding:0;font-size:13px}.legend li{margin:7px 0;display:flex;gap:8px;align-items:center}.legend i{width:10px;height:10px;border-radius:3px}
.hb{display:grid;grid-template-columns:130px 1fr 90px;gap:10px;align-items:center;margin:11px 0;font-size:13px}.hb b{text-align:right}
.track{background:#eef1f7;height:10px;border-radius:9px;overflow:hidden}.track i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,var(--pri),#06b6d4)}
.empty{color:var(--mut);padding:26px;text-align:center}.banner{background:linear-gradient(135deg,#4f46e5,#06b6d4);color:#fff;border-radius:16px;padding:22px;margin-bottom:18px;display:flex;justify-content:space-between;align-items:center;gap:14px}
.banner .btn{background:#fff;color:var(--pri)}
.bar2{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap}.bar2 input,.bar2 select,.f input,.f select{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff;outline:none;width:100%}
.bar2 input{max-width:300px}input:focus,select:focus{border-color:var(--pri2);box-shadow:0 0 0 3px rgba(99,102,241,.15)}
.pos{display:grid;grid-template-columns:1fr 380px;gap:18px;align-items:start}.chips{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.chip{border:1px solid var(--line);background:#fff;border-radius:99px;padding:6px 14px;font-size:13px}.chip.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.pcard{text-align:left;background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;transition:.15s}.pcard:hover:not(:disabled){border-color:var(--pri2);box-shadow:0 8px 20px rgba(79,70,229,.12);transform:translateY(-2px)}
.pcard:disabled{opacity:.45;cursor:not-allowed}.pcat{font-size:11px;color:var(--pri);font-weight:600;text-transform:uppercase}.pname{font-weight:600;margin:6px 0 10px;min-height:36px}.prow{display:flex;justify-content:space-between;align-items:center}
.stock{font-size:11px;color:var(--mut)}.stock.low{color:var(--bad);font-weight:600}
.cart{position:sticky;top:20px}.line{display:grid;grid-template-columns:1fr auto 74px 22px;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.ln{font-weight:600;font-size:13px}.ls{font-size:12px;color:var(--mut)}.qty{display:flex;align-items:center;gap:6px}.qty button{width:24px;height:24px;border-radius:7px;border:1px solid var(--line);background:#fff}.qty span{min-width:18px;text-align:center}
.x{border:0;background:none;color:#94a3b8;font-size:18px}.x:hover{color:var(--bad)}.f{display:grid;gap:8px;margin:12px 0}.f.two{grid-template-columns:1fr 1fr}.f label{font-size:12px;color:var(--mut);display:block;margin-bottom:4px}
.seg{display:flex;background:#eef1f7;border-radius:10px;padding:3px}.seg button{flex:1;border:0;background:none;padding:8px;border-radius:8px;font-weight:600;color:var(--mut)}.seg button.on{background:#fff;color:var(--pri);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.tot div{display:flex;justify-content:space-between;padding:4px 0;color:var(--mut)}.tot .g{color:var(--ink);font-size:20px;font-weight:700;border-top:1px dashed var(--line);margin-top:8px;padding-top:12px}.tot .d{color:var(--ok)}
.err{color:var(--bad);font-size:12px;min-height:16px}
#modal{position:fixed;inset:0;background:rgba(15,23,42,.55);display:none;place-items:center;z-index:20;padding:20px;backdrop-filter:blur(3px)}#modal.show{display:grid}
.mbox{background:#fff;border-radius:18px;padding:24px;width:100%;max-width:480px;max-height:92vh;overflow:auto;animation:pop .18s}.mbox.wide{max-width:600px}@keyframes pop{from{transform:scale(.96);opacity:0}}
.mh{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.mh h2{font-size:18px}
#toasts{position:fixed;right:20px;bottom:20px;display:grid;gap:8px;z-index:30}.toast{background:#0f172a;color:#fff;padding:12px 18px;border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.25);animation:pop .2s}.toast.err{background:#b91c1c}.toast.ok{background:#047857}
.inv{font-family:ui-monospace,Consolas,monospace;font-size:12.5px}.inv h2{text-align:center;font-family:inherit}.inv .c{text-align:center;color:var(--mut)}.inv table td,.inv table th{padding:6px 4px;border:0}.inv hr{border:0;border-top:1px dashed #94a3b8;margin:10px 0}
.void{border:2px solid var(--bad);color:var(--bad);text-align:center;font-weight:700;padding:6px;margin:8px 0;transform:rotate(-2deg)}
@media(max-width:1000px){.app{grid-template-columns:1fr}aside.side{position:static;height:auto}.pos,.r3,.kpis{grid-template-columns:1fr}.kpis{grid-template-columns:1fr 1fr}}
@media print{body *{visibility:hidden}#invoice,#invoice *{visibility:visible}#invoice{position:absolute;left:0;top:0;width:100%}}
</style></head><body>
<div class="app">
<aside class="side"><div class="brand"><div class="logo">R</div>RetailPro</div>
<nav>
<a href="#dashboard" data-k="dashboard"><svg viewBox="0 0 24 24"><path d="M3 3h7v9H3zM14 3h7v5h-7zM14 12h7v9h-7zM3 16h7v5H3z"/></svg>Dashboard</a>
<a href="#pos" data-k="pos"><svg viewBox="0 0 24 24"><circle cx="9" cy="20" r="1"/><circle cx="18" cy="20" r="1"/><path d="M2 3h3l3 12h11l2-8H6"/></svg>New Bill</a>
<a href="#inventory" data-k="inventory"><svg viewBox="0 0 24 24"><path d="M21 8l-9-5-9 5v8l9 5 9-5zM3 8l9 5 9-5M12 13v8"/></svg>Inventory</a>
<a href="#invoices" data-k="invoices"><svg viewBox="0 0 24 24"><path d="M6 2h9l5 5v15H6zM14 2v6h6M9 13h8M9 17h8"/></svg>Invoices</a>
<a href="#reports" data-k="reports"><svg viewBox="0 0 24 24"><path d="M3 3v18h18M7 15l4-4 3 3 5-6"/></svg>Reports</a>
</nav><div class="sfoot">RetailPro v1.0<br>Local billing system</div></aside>
<main><div class="top"><div><h1 id="title"></h1><p id="sub"></p></div><div id="actions"></div></div><div id="view"></div></main>
</div>
<div id="modal"></div><div id="toasts"></div>
<script>
const $=(s,r=document)=>r.querySelector(s),COLORS=['#4f46e5','#06b6d4','#f59e0b','#10b981','#ef4444','#8b5cf6','#ec4899'];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>'₹'+Number(n).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});
const money0=n=>'₹'+Math.round(n).toLocaleString('en-IN'),short=n=>n>=1000?(n/1000).toFixed(n>=10000?0:1)+'k':Math.round(n);
async function api(u,m='GET',b){const r=await fetch(u,{method:m,headers:{'Content-Type':'application/json'},body:b?JSON.stringify(b):undefined});
 const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'Request failed');return d}
function toast(t,k='ok'){const e=document.createElement('div');e.className='toast '+k;e.textContent=t;$('#toasts').append(e);setTimeout(()=>e.remove(),3200)}
function modal(h,w){$('#modal').innerHTML=`<div class="mbox ${w||''}">${h}</div>`;$('#modal').classList.add('show')}
function closeModal(){$('#modal').classList.remove('show')}
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
const empty=t=>`<div class="empty">${t}</div>`;
/* ---------- charts ---------- */
function barChart(rows){if(!rows.length)return empty('No sales yet');
 const W=560,H=230,L=44,B=30,T=14,max=Math.max(...rows.map(r=>r[1]))||1,bw=Math.min(54,(W-L)/rows.length-14);
 let s=`<svg viewBox="0 0 ${W} ${H}" class="chart"><defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6366f1"/><stop offset="1" stop-color="#06b6d4"/></linearGradient></defs>`;
 for(let i=0;i<=4;i++){const y=T+(H-T-B)*i/4;s+=`<line x1="${L}" x2="${W}" y1="${y}" y2="${y}" class="grid"/><text x="${L-6}" y="${y+4}" text-anchor="end" class="ax">${short(max*(1-i/4))}</text>`}
 rows.forEach((r,i)=>{const x=L+(W-L)/rows.length*(i+.5)-bw/2,h=(H-T-B)*r[1]/max;
  s+=`<rect x="${x}" y="${H-B-h}" width="${bw}" height="${h}" rx="6" class="bar"><title>${r[0]}: ${money(r[1])}</title></rect><text x="${x+bw/2}" y="${H-10}" text-anchor="middle" class="ax">${r[0].slice(5)}</text>`});
 return s+'</svg>'}
function donut(rows){const tot=rows.reduce((a,r)=>a+r[1],0);if(!tot)return empty('No sales yet');
 const C=2*Math.PI*52;let off=0,s='<svg viewBox="0 0 140 140" class="donut"><g transform="rotate(-90 70 70)">';
 rows.forEach((r,i)=>{const l=C*r[1]/tot;s+=`<circle cx="70" cy="70" r="52" fill="none" stroke="${COLORS[i%7]}" stroke-width="22" stroke-dasharray="${l} ${C-l}" stroke-dashoffset="${-off}"/>`;off+=l});
 s+=`</g><text x="70" y="68" text-anchor="middle" class="dn">${money0(tot)}</text><text x="70" y="82" text-anchor="middle" class="dl">TOTAL</text></svg>`;
 return `<div class="donutwrap">${s}<ul class="legend">${rows.map((r,i)=>`<li><i style="background:${COLORS[i%7]}"></i>${esc(r[0])} <b>${Math.round(100*r[1]/tot)}%</b></li>`).join('')}</ul></div>`}
function hbars(rows,f){if(!rows.length)return empty('No sales yet');const m=Math.max(...rows.map(r=>r[1]))||1;
 return rows.map(r=>`<div class="hb"><span>${esc(r[0])}</span><div class="track"><i style="width:${100*r[1]/m}%"></i></div><b>${f(r)}</b></div>`).join('')}
/* ---------- invoice ---------- */
function invoiceHTML(b){return `<div id="invoice" class="inv"><h2>RETAILPRO SUPERMART</h2><div class="c">Tax Invoice</div><hr>
<div style="display:flex;justify-content:space-between"><span>${b.invoice}</span><span>${b.timestamp}</span></div>
<div>Customer: ${esc(b.customer)}${b.phone?' · '+b.phone:''}</div><div>Payment: ${b.payment}</div><hr>
<table><tr><th>Item</th><th class="r">Qty</th><th class="r">Rate</th><th class="r">GST</th><th class="r">Amount</th></tr>
${b.lines.map(l=>`<tr><td>${esc(l.name)}</td><td class="r">${l.qty}</td><td class="r">${l.price.toFixed(2)}</td><td class="r">${l.gst_rate}%</td><td class="r">${l.amount.toFixed(2)}</td></tr>`).join('')}</table><hr>
<table><tr><td>Subtotal</td><td class="r">${b.subtotal.toFixed(2)}</td></tr>
${b.discount_pct?`<tr><td>Discount (${b.discount_pct}%${b.coupon?', '+b.coupon:''})</td><td class="r">-${b.discount_amt.toFixed(2)}</td></tr>`:''}
<tr><td>CGST</td><td class="r">${b.cgst.toFixed(2)}</td></tr><tr><td>SGST</td><td class="r">${b.sgst.toFixed(2)}</td></tr><tr><td>Round off</td><td class="r">${b.round_off.toFixed(2)}</td></tr>
<tr><td><b>GRAND TOTAL</b></td><td class="r"><b>${money(b.grand_total)}</b></td></tr></table><hr>
${b.status==='VOID'?'<div class="void">CANCELLED (VOID)</div>':''}<div class="c">Thank you for shopping with us!</div></div>`}
function showInvoice(b){modal(`<div class="mh"><h2>Invoice ${b.invoice}</h2><button class="btn ghost sm" onclick="closeModal()">Close</button></div>${invoiceHTML(b)}
<div style="margin-top:16px;display:flex;gap:8px"><button class="btn" onclick="window.print()">Print / Save PDF</button></div>`,'wide')}
/* ---------- dashboard ---------- */
async function vDash(){const d=await api('/api/dashboard'),s=d.summary;
 const kp=(l,v,sub,c)=>`<div class="card kpi" style="--c:${c}"><div class="l">${l}</div><div class="v">${v}</div><div class="s">${sub}</div></div>`;
 $('#view').innerHTML=(d.items_count?'':`<div class="banner"><div><h3 style="font-size:18px">Welcome to RetailPro</h3><p>Your catalogue is empty. Load sample items and bills to explore the system.</p></div><button class="btn" onclick="loadDemo()">Load demo data</button></div>`)+
 `<div class="row kpis">${kp('Total revenue',money0(s.revenue),s.bills+' paid invoices','#4f46e5')}${kp('Average bill',money0(s.average),'per invoice','#06b6d4')}
 ${kp('GST collected',money0(s.gst),'CGST + SGST','#10b981')}${kp('Discounts given',money0(s.discounts),d.items_count+' items in catalogue','#f59e0b')}</div>
 <div class="row r3"><div class="card"><h3>Sales - last 7 days</h3>${barChart(d.daily)}</div><div class="card"><h3>Payment modes</h3>${donut(d.by_payment)}</div></div>
 <div class="row r3"><div class="card"><h3>Recent invoices</h3>${d.recent.length?`<table><tr><th>Invoice</th><th>Customer</th><th>Payment</th><th class="r">Total</th><th>Status</th></tr>${d.recent.map(b=>`<tr><td><a href="#" onclick='openBill("${b.invoice}");return false'>${b.invoice}</a></td><td>${esc(b.customer)}</td><td>${b.payment}</td><td class="r">${money(b.grand_total)}</td><td>${pill(b.status)}</td></tr>`).join('')}</table>`:empty('No invoices yet')}</div>
 <div class="card"><h3>Low stock alerts</h3>${d.low_stock.length?d.low_stock.map(i=>`<div class="hb" style="grid-template-columns:1fr auto"><span>${esc(i.name)}</span><span class="pill ${i.stock?'p-warn':'p-bad'}">${i.stock} left</span></div>`).join(''):empty('All items well stocked')}</div></div>`}
const pill=s=>`<span class="pill ${s==='PAID'?'p-ok':'p-bad'}">${s}</span>`;
async function loadDemo(){const r=await api('/api/demo','POST');toast(`Loaded ${r.items} items and ${r.bills} sample bills`);route()}
async function openBill(i){showInvoice(await api('/api/bills/'+i))}
/* ---------- POS ---------- */
let S={items:[],cart:[],cat:'All',q:'',pay:'Cash',coupon:'',pv:null},META;
async function vPos(){S.items=await api('/api/items');
 $('#view').innerHTML=`<div class="pos"><section><div class="bar2"><input id="q" placeholder="Search products by name or code..." value="${esc(S.q)}"></div><div class="chips" id="chips"></div><div class="grid" id="grid"></div></section>
 <aside class="card cart"><h3>Current bill</h3><div id="lines"></div>
 <div class="f two"><div><label>Customer</label><input id="cust" placeholder="Walk-in"></div><div><label>Phone</label><input id="phone" placeholder="Optional"></div></div>
 <div class="f"><label>Coupon</label><div style="display:flex;gap:8px"><input id="coupon" placeholder="e.g. WELCOME10" value="${esc(S.coupon)}"><button class="btn ghost sm" id="apply">Apply</button></div><div class="err" id="cerr"></div></div>
 <div class="seg" id="seg">${META.payments.map(p=>`<button data-p="${p}" class="${p===S.pay?'on':''}">${p}</button>`).join('')}</div>
 <div class="tot" id="tot" style="margin:14px 0"></div><div style="display:flex;gap:8px"><button class="btn" id="go" style="flex:1" disabled>Generate invoice</button><button class="btn ghost" id="clr">Clear</button></div></aside></div>`;
 $('#q').oninput=e=>{S.q=e.target.value;grid()};$('#grid').onclick=e=>{const c=e.target.closest('.pcard');if(c)add(c.dataset.c)};
 $('#chips').onclick=e=>{if(e.target.dataset.c){S.cat=e.target.dataset.c;chips();grid()}};
 $('#lines').onclick=e=>{const b=e.target.closest('button');if(!b)return;const c=b.dataset.c;if(b.dataset.d)qty(c,+b.dataset.d);if(b.dataset.x)(S.cart=S.cart.filter(l=>l.code!==c),cart())};
 $('#apply').onclick=()=>{S.coupon=$('#coupon').value.trim();preview()};$('#seg').onclick=e=>{if(e.target.dataset.p){S.pay=e.target.dataset.p;[...$('#seg').children].forEach(b=>b.classList.toggle('on',b.dataset.p===S.pay))}};
 $('#clr').onclick=()=>{S.cart=[];S.coupon='';$('#coupon').value='';cart()};$('#go').onclick=checkout;chips();grid();cart()}
function chips(){$('#chips').innerHTML=['All',...META.categories].map(c=>`<button class="chip ${c===S.cat?'on':''}" data-c="${c}">${c}</button>`).join('')}
function grid(){const q=S.q.toLowerCase(),L=S.items.filter(i=>(S.cat==='All'||i.category===S.cat)&&(i.name.toLowerCase().includes(q)||i.code.toLowerCase().includes(q)));
 $('#grid').innerHTML=L.length?L.map(i=>`<button class="pcard" data-c="${i.code}" ${i.stock<1?'disabled':''}><div class="pcat">${i.category}</div><div class="pname">${esc(i.name)}</div><div class="prow"><b>${money(i.price)}</b><span class="stock ${i.stock<=META.low?'low':''}">${i.stock?i.stock+' left':'Out of stock'}</span></div></button>`).join(''):empty('No products found')}
function add(c){const it=S.items.find(i=>i.code===c),l=S.cart.find(x=>x.code===c),n=(l?l.qty:0)+1;if(n>it.stock)return toast(`Only ${it.stock} in stock`,'err');l?l.qty=n:S.cart.push({code:c,qty:1});cart()}
function qty(c,d){const l=S.cart.find(x=>x.code===c),it=S.items.find(i=>i.code===c),n=l.qty+d;if(n<1){S.cart=S.cart.filter(x=>x!==l)}else if(n>it.stock)return toast(`Only ${it.stock} in stock`,'err');else l.qty=n;cart()}
function cart(){$('#lines').innerHTML=S.cart.length?S.cart.map(l=>{const i=S.items.find(x=>x.code===l.code);return `<div class="line"><div><div class="ln">${esc(i.name)}</div><div class="ls">${money(i.price)} each</div></div><div class="qty"><button data-c="${l.code}" data-d="-1">−</button><span>${l.qty}</span><button data-c="${l.code}" data-d="1">+</button></div><b>${money(i.price*l.qty)}</b><button class="x" data-c="${l.code}" data-x="1">×</button></div>`}).join(''):empty('Tap a product to add it');preview()}
async function preview(){let p;const body=c=>({items:S.cart,coupon:c});$('#cerr').textContent='';
 try{p=await api('/api/preview','POST',body(S.coupon))}catch(e){$('#cerr').textContent=e.message;try{p=await api('/api/preview','POST',body(''))}catch(_){p={empty:true}}}
 S.pv=p;const t=$('#tot');$('#go').disabled=!!p.empty;
 t.innerHTML=p.empty?'':`<div><span>Subtotal</span><span>${money(p.subtotal)}</span></div>${p.discount_pct?`<div class="d"><span>Discount (${p.discount_pct}%)</span><span>-${money(p.discount_amt)}</span></div>`:''}<div><span>CGST</span><span>${money(p.cgst)}</span></div><div><span>SGST</span><span>${money(p.sgst)}</span></div><div><span>Round off</span><span>${p.round_off.toFixed(2)}</span></div><div class="g"><span>Total</span><span>${money(p.grand_total)}</span></div>`}
async function checkout(){try{const b=await api('/api/bills','POST',{items:S.cart,customer:$('#cust').value,phone:$('#phone').value,payment:S.pay,coupon:S.coupon});
 S.cart=[];S.coupon='';toast('Invoice '+b.invoice+' created');await vPos();showInvoice(b)}catch(e){toast(e.message,'err')}}
/* ---------- inventory ---------- */
let IQ='',IC='All';
async function vInv(){S.items=await api('/api/items');
 $('#actions').innerHTML='<button class="btn" onclick="itemForm()">+ Add item</button>';
 $('#view').innerHTML=`<div class="bar2"><input id="iq" placeholder="Search items..." value="${esc(IQ)}"><select id="ic" style="max-width:200px"><option>All</option>${META.categories.map(c=>`<option ${c===IC?'selected':''}>${c}</option>`).join('')}</select></div><div class="card" style="padding:8px 12px" id="itbl"></div>`;
 $('#iq').oninput=e=>{IQ=e.target.value;itbl()};$('#ic').onchange=e=>{IC=e.target.value;itbl()};itbl()}
function itbl(){const q=IQ.toLowerCase(),L=S.items.filter(i=>(IC==='All'||i.category===IC)&&(i.name.toLowerCase().includes(q)||i.code.toLowerCase().includes(q)));
 $('#itbl').innerHTML=L.length?`<table><tr><th>Code</th><th>Item</th><th>Category</th><th class="r">Price</th><th class="r">GST</th><th class="r">Stock</th><th class="r">Actions</th></tr>${L.map(i=>`<tr><td><b>${i.code}</b></td><td>${esc(i.name)}</td><td><span class="pill p-blue">${i.category}</span></td><td class="r">${money(i.price)}</td><td class="r">${i.gst}%</td>
 <td class="r"><span class="pill ${i.stock===0?'p-bad':i.stock<=META.low?'p-warn':'p-ok'}">${i.stock===0?'Out':i.stock<=META.low?'Low · '+i.stock:i.stock}</span></td>
 <td class="r"><button class="btn ghost sm" onclick="editItem('${i.code}')">Edit</button> <button class="btn bad sm" onclick="delItem('${i.code}')">Delete</button></td></tr>`).join('')}</table>`:empty('No items found')}
function itemForm(){modal(`<div class="mh"><h2>Add new item</h2><button class="btn ghost sm" onclick="closeModal()">Close</button></div><div class="f two"><div><label>Item code</label><input id="a_code" placeholder="RICE02"></div><div><label>Name</label><input id="a_name"></div>
 <div><label>Category</label><select id="a_cat">${META.categories.map(c=>`<option>${c}</option>`).join('')}</select></div><div><label>GST %</label><select id="a_gst">${META.gst.map(g=>`<option>${g}</option>`).join('')}</select></div>
 <div><label>Price (₹)</label><input id="a_price" type="number" min="0" step="0.01"></div><div><label>Opening stock</label><input id="a_stock" type="number" min="0"></div></div><button class="btn" onclick="saveItem()" style="width:100%">Save item</button>`)}
async function saveItem(){try{await api('/api/items','POST',{code:$('#a_code').value,name:$('#a_name').value,category:$('#a_cat').value,price:$('#a_price').value,stock:$('#a_stock').value,gst:$('#a_gst').value});closeModal();toast('Item added');vInv()}catch(e){toast(e.message,'err')}}
function editItem(c){const i=S.items.find(x=>x.code===c);modal(`<div class="mh"><h2>${esc(i.name)}</h2><button class="btn ghost sm" onclick="closeModal()">Close</button></div>
 <div class="f"><label>Price (₹)</label><div style="display:flex;gap:8px"><input id="e_price" type="number" step="0.01" value="${i.price}"><button class="btn" onclick="upd('${c}','price')">Update</button></div>
 <label>Add stock (current: ${i.stock})</label><div style="display:flex;gap:8px"><input id="e_stock" type="number" min="1" placeholder="Quantity"><button class="btn" onclick="upd('${c}','restock')">Add</button></div></div>`)}
async function upd(c,k){try{await api('/api/items/'+c,'PUT',{[k]:$(k==='price'?'#e_price':'#e_stock').value});closeModal();toast('Item updated');vInv()}catch(e){toast(e.message,'err')}}
async function delItem(c){if(!confirm('Delete item '+c+'?'))return;try{await api('/api/items/'+c,'DELETE');toast('Item deleted');vInv()}catch(e){toast(e.message,'err')}}
/* ---------- invoices ---------- */
let BQ='';
async function vBills(){const L=await api('/api/bills');
 $('#view').innerHTML=`<div class="bar2"><input id="bq" placeholder="Search invoice or customer..." value="${esc(BQ)}"></div><div class="card" style="padding:8px 12px" id="btbl"></div>`;
 const draw=()=>{const q=BQ.toLowerCase(),F=L.filter(b=>b.invoice.toLowerCase().includes(q)||b.customer.toLowerCase().includes(q));
  $('#btbl').innerHTML=F.length?`<table><tr><th>Invoice</th><th>Date</th><th>Customer</th><th>Payment</th><th class="r">Total</th><th>Status</th><th class="r">Actions</th></tr>${F.map(b=>`<tr><td><b>${b.invoice}</b></td><td>${b.timestamp}</td><td>${esc(b.customer)}</td><td>${b.payment}</td><td class="r">${money(b.grand_total)}</td><td>${pill(b.status)}</td>
  <td class="r"><button class="btn ghost sm" onclick="openBill('${b.invoice}')">View</button> ${b.status==='PAID'?`<button class="btn bad sm" onclick="voidBill('${b.invoice}')">Void</button>`:''}</td></tr>`).join('')}</table>`:empty('No invoices found')};
 $('#bq').oninput=e=>{BQ=e.target.value;draw()};draw()}
async function voidBill(i){if(!confirm('Cancel '+i+'? Items will return to stock.'))return;try{await api('/api/bills/'+i+'/void','POST');toast(i+' cancelled, stock restored');vBills()}catch(e){toast(e.message,'err')}}
/* ---------- reports ---------- */
async function vReports(){const d=await api('/api/dashboard'),s=d.summary;
 $('#actions').innerHTML='<a class="btn ghost" href="/api/export/bills">Export bills CSV</a> <a class="btn" href="/api/export/inventory">Export inventory CSV</a>';
 $('#view').innerHTML=`<div class="row r3" style="grid-template-columns:1fr 1fr"><div class="card"><h3>Sales by category</h3>${hbars(d.by_category,r=>money0(r[1]))}</div><div class="card"><h3>Top selling items</h3>${hbars(d.top_items.map(t=>[t[0],t[1],t[2]]),r=>r[1]+' units')}</div></div>
 <div class="row r3" style="grid-template-columns:1fr 1fr"><div class="card"><h3>Revenue by payment mode</h3>${donut(d.by_payment)}</div><div class="card"><h3>Summary</h3><table>
 <tr><td>Paid invoices</td><td class="r"><b>${s.bills}</b></td></tr><tr><td>Total revenue</td><td class="r"><b>${money(s.revenue)}</b></td></tr><tr><td>GST collected</td><td class="r"><b>${money(s.gst)}</b></td></tr><tr><td>Discounts given</td><td class="r"><b>${money(s.discounts)}</b></td></tr><tr><td>Average bill</td><td class="r"><b>${money(s.average)}</b></td></tr></table></div></div>
 <div class="card"><h3>Daily sales</h3>${barChart(d.daily)}</div>`}
/* ---------- router ---------- */
const V={dashboard:['Dashboard','Business overview at a glance',vDash],pos:['New Bill','Tap products to build a bill',vPos],inventory:['Inventory','Manage products, prices and stock',vInv],invoices:['Invoices','Every bill, searchable',vBills],reports:['Reports','Sales analytics and exports',vReports]};
async function route(){const k=(location.hash||'#dashboard').slice(1),v=V[k]||V.dashboard;closeModal();
 document.querySelectorAll('nav a').forEach(a=>a.classList.toggle('on',a.dataset.k===(V[k]?k:'dashboard')));
 $('#title').textContent=v[0];$('#sub').textContent=v[1];$('#actions').innerHTML='';
 try{if(!META)META=await api('/api/meta');await v[2]()}catch(e){$('#view').innerHTML=empty('Error: '+esc(e.message))}}
addEventListener('hashchange',route);route();
</script></body></html>
